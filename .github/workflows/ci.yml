name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Test package with coverage
        run: swift test --enable-code-coverage
      - name: Verify coverage report
        id: coverage
        run: |
          coverage_path="$(swift test --show-codecov-path)"
          test -s "$coverage_path"
          echo "path=$coverage_path" >> "$GITHUB_OUTPUT"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: swift-code-coverage
          path: ${{ steps.coverage.outputs.path }}
      - name: Publish coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ${{ steps.coverage.outputs.path }}
          fail_ci_if_error: true
      - name: Check strict concurrency
        run: >-
          swift test
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors
