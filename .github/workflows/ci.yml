name: CI / Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: macOS Swift package gate
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, test, and enforce coverage
        run: ./Scripts/ci.sh

      - name: Publish production coverage summary
        if: ${{ always() }}
        run: |
          summary_path=".build/coverage/production-summary.md"
          if [[ -f "${summary_path}" ]]; then
            cat "${summary_path}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Coverage summary was not produced; inspect the failing gate step." \
              >> "${GITHUB_STEP_SUMMARY}"
          fi
