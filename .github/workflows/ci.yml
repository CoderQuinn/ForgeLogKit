name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test package
        run: swift test
      - name: Check strict concurrency
        run: >-
          swift test
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors
